[package]
name = "rs4a-firmware-inventory"
version = "0.1.0"
edition.workspace = true
license = "MIT"
description = "Utilities for filtering, downloading and caching firmware"

[lints]
workspace = true

[[bin]]
name = "firmware-inventory"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
dirs = { workspace = true }
glob = { workspace = true }
log = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true, features = ["json", "http2", "rustls-tls"] }
semver = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }

rs4a-authentication = { workspace = true }
rs4a-bin-utils = { workspace = true }
rs4a-vlt = { workspace = true }
